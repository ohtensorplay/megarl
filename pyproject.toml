[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "megarl"
version = "0.1.0"
description = "RL post-training infrastructure for the TensorPlay ecosystem"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "tensorplay>=1.3.0.dev0,<2",
    "megatrain>=0.1,<0.2",
    "tensorplay-observability>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Optional OTLP metrics/traces export; all hooks no-op without these.
otel = [
    "opentelemetry-api>=1.44",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
]
# Training-trackers fan-out used by ``megarl.observability.Tracking``.
tracking = ["tensorboard>=2.14", "wandb>=0.16"]
# Pinned host-memory staging (cudaHostRegister) needs PyTorch; the rest of the
# data plane and the controller work without it.
pinned = ["torch>=2.15.0"]
# Embedded megaLM rollout backend. The service path needs a running
# megalm-server instead and does not require this extra in the client.
rollout = ["megalm-runtime>=0.2,<0.3"]

[project.urls]
Homepage = "https://github.com/ohtensorplay/megarl"
Repository = "https://github.com/ohtensorplay/megarl"
Issues = "https://github.com/ohtensorplay/megarl/issues"

[tool.maturin]
python-source = "src"
module-name = "megarl.megarl_rs"
manifest = "rust/Cargo.toml"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff.lint]
# Blocking gate shared by local checks, pre-commit and CI: catch syntax errors
# and undefined names. Broader style rules are rolled out incrementally.
select = ["E9", "F63", "F7", "F82"]
