name: 🐞 Bug report
description: Report reproducible incorrect behavior in megaRL
title: "[Bug] "
labels: ["bug"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find this problem.
          required: true
        - label: I am using the latest release or the current `main` branch.
          required: true
        - label: I can provide a minimal reproduction and environment details below.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: |
        Include the exact controller configuration, rollout/reward backend, and
        the smallest script or command that reproduces the problem. Attach the
        full traceback or telemetry JSON if possible (redact secrets).
      placeholder: |
        ControllerConfig(max_staleness=4, group_size=8, ...)
        EmbeddedRolloutConfig(model_path=..., device="cuda")
        python -m pytest tests/test_async_controller.py -q
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide: OS, GPU model and driver, CUDA version, Python version,
        megaRL version/commit, TensorPlay and MegaLM versions, and how you
        installed it (including whether the Rust extension was rebuilt).
      placeholder: |
        megaRL: 0.1.0 (commit ...)
        Python: 3.12.x, CUDA: 12.x, GPU: RTX 3090
        TensorPlay: 1.3.0.dev..., MegaLM: 0.2.0, install: pip install -e ".[test]"
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround / additional context
      description: Anything else that may help, including a workaround you found.
