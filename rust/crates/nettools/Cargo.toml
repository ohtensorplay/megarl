[package]
name = "megarl-nettools"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Hardened HTTP core for megaRL's network tools"

[dependencies]
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "rt"] }
